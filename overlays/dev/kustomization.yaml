apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerce-dev
resources:
- ../../base/order-service
- ../../base/payment-service
- ../../dev-infra/kafka
- ../../base/gateway

patches:
- patch: |-
    - op: replace
      path: /spec/maxReplicas
      value: 3
    - op: replace
      path: /spec/minReplicas
      value: 1
  target:
    kind: HorizontalPodAutoscaler
images:
- name: ghcr.io/roudane2021/order-service
  newTag: <sha-d-un-commit-publie>
- name: ghcr.io/roudane2021/payment-service
  newTag: <sha-d-un-commit-publie>
- name: order-service
  newName: ghcr.io/roudane2021/order-service
  newTag: 3e9a57e
- name: payment-service
  newName: ghcr.io/roudane2021/payment-service
  newTag: 3e9a57e
labels:
- includeTemplates: true
  pairs:
    environment: dev
      # - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/orderdb
      #  - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/paymentdb
configMapGenerator:
- behavior: merge
  literals:
  - SPRING_PROFILES_ACTIVE=local
  - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  - SPRING_JPA_HIBERNATE_DDL_AUTO=update
  - SPRING_FLYWAY_ENABLED=false
  - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
  name: order-service-config
- behavior: merge
  literals:
  - SPRING_PROFILES_ACTIVE=local
  - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  - SPRING_JPA_HIBERNATE_DDL_AUTO=update
  - SPRING_FLYWAY_ENABLED=false
  - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
  name: payment-service-config
secretGenerator:
- envs:
  - secrets-order.env
  name: order-service-secrets
- envs:
  - secrets-payment.env
  name: payment-service-secrets
